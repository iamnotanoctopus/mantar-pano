<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3ece1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1815" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Notion ile canlı senkron çalışan mantar pano görev uygulaması." />
    <link rel="icon" href="/pin.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pin-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mantar Pano</title>
    <script>
      // İlk boyamada tema titremesini önlemek için tercihi erkenden uygula.
      try {
        var t = localStorage.getItem("mp.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var s = localStorage.getItem("mp.skin");
        if (s && s !== "mantar") document.documentElement.dataset.skin = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
