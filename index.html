<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Amanita zemini; seçilen temaya göre src/state/prefs.tsx günceller -->
    <meta name="theme-color" content="#ebe4cf" />
    <meta name="description" content="Notion ile canlı senkron çalışan mantar pano görev uygulaması." />
    <link rel="icon" href="/pin.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pin-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mantar Pano</title>
    <script>
      // İlk boyamada tema titremesini önlemek için tercihi erkenden uygula (src/state/prefsModel.ts ile aynı kural).
      try {
        var ids = ["amanita", "classic-cork", "cupertino-glass", "midnight-wood"];
        var t = localStorage.getItem("mp.theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (t === "system") t = dark ? "midnight-wood" : "amanita";
        else if (ids.indexOf(t) < 0) t = t === "dark" ? "midnight-wood" : localStorage.getItem("mp.prefs") ? "classic-cork" : "amanita";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
